<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .radio-group {
            margin-top: 8px;
        }

        .radio-group input {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Event Registration</h2>

    <form action="#" method="post">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>

        <label for="rollno">Roll Number</label>
        <input type="text" id="rollno" name="rollno"
               placeholder="Enter your roll number" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number" required>

        <label for="course">Course</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="btech">B.Tech</option>
            <option value="bsc">B.Sc</option>
            <option value="bcom">B.Com</option>
            <option value="ba">B.A</option>
            <option value="mca">MCA</option>
            <option value="mba">MBA</option>
        </select>

        <label for="event">Select Event</label>
        <select id="event" name="event" required>
            <option value="">-- Select Event --</option>
            <option value="technical">Technical Workshop</option>
            <option value="cultural">Cultural Fest</option>
            <option value="sports">Sports Meet</option>
            <option value="seminar">Seminar</option>
            <option value="hackathon">Hackathon</option>
        </select>

        <label>Gender</label>
        <div class="radio-group">
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
        </div>

        <label for="date">Event Date</label>
        <input type="date" id="date" name="date" required>

        <label for="comments">Additional Comments</label>
        <textarea id="comments" name="comments"
                  rows="4"
                  placeholder="Enter any additional information"></textarea>

        <button type="submit">Register Now</button>

    </form>
</div>

</body>
</html>
